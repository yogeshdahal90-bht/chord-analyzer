<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Web Audio Chord Analyzer</title>
  <link rel="stylesheet" href="css/styles.css">

  <!-- Essentia.js WebAssembly Build for Chromagram/HPCP Extraction -->
  <script src="https://cdn.jsdelivr.net/npm/essentia.js@0.1.3/dist/essentia-wasm.web.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/essentia.js@0.1.3/dist/essentia.js-core.js"></script>
</head>
<body>
  <div class="app-container">
    <header>
      <h1>Chord Analyzer & Transposer</h1>
      <div class="controls-bar">
        <input type="file" id="audio-input" accept="audio/mp3, audio/wav, audio/ogg">
        <div class="capo-selector">
          <label for="capo-select">Capo Position:</label>
          <select id="capo-select">
            <option value="0">No Capo (Standard)</option>
            <option value="1">Capo 1</option>
            <option value="2">Capo 2</option>
            <option value="3">Capo 3</option>
            <option value="4">Capo 4</option>
            <option value="5">Capo 5</option>
            <option value="6">Capo 6</option>
            <option value="7">Capo 7</option>
          </select>
        </div>
      </div>
    </header>

    <main>
      <audio id="audio-player" controls></audio>
      
      <section class="chord-display-container">
        <h2>Detected Progression</h2>
        <div id="chord-timeline" class="chord-timeline">
          <p style="color: var(--text-dim);">Upload an audio file to generate real-time chord mappings.</p>
        </div>
      </section>

      <section class="diagram-container">
        <h2>Active Guitar Shape</h2>
        <div id="chord-diagram"></div>
      </section>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
